<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的重要日期</title>
<style>body{font:15px/1.6 system-ui,sans-serif;margin:0;padding:24px;color:#172033;background:#f8fafc}h1{font-size:24px;margin:0}p{color:#64748b}form{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}input,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px}button{cursor:pointer;background:#fff}button[type=submit]{background:#334155;color:white}ul{padding:0;list-style:none}li{display:flex;gap:14px;align-items:center;padding:14px;background:white;border-radius:10px;margin:8px 0}li span{flex:1}time{font-weight:600}#status{min-height:24px}button:disabled{opacity:.5}label{display:flex;flex-direction:column;gap:5px;font-size:13px}</style></head>
<body><h1>我的重要日期</h1><p>记录生日、纪念日和其他每年重复的重要日期。</p>
<form id="form"><label>名称<input id="name" required maxlength="200" placeholder="例如：项目周年纪念"></label><label>日期（月-日）<input id="date" required pattern="[0-9]{2}-[0-9]{2}" placeholder="例如：10-13"></label><button type="submit">添加日期</button></form>
<p id="status" role="status">正在连接…</p><ul id="dates"></ul>
<script>
let sequence=0; const pending=new Map(); const status=document.getElementById('status');
function request(method,params){const id=++sequence;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('请求超时'))},65000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
function show(result){if(result.isError)throw new Error(result.content?.[0]?.text||'操作失败');const data=result.structuredContent;const list=document.getElementById('dates');list.replaceChildren();for(const item of data.dates){const li=document.createElement('li'),date=document.createElement('time'),name=document.createElement('span'),remove=document.createElement('button');date.textContent=item.date;name.textContent=item.name;remove.textContent='删除';remove.onclick=async()=>{remove.disabled=true;try{show(await request('tools/call',{name:'delete_date',arguments:{id:item.id}}))}catch(error){status.textContent=error.message;remove.disabled=false}};li.append(date,name,remove);list.append(li)}status.textContent=data.dates.length?`共 ${data.dates.length} 个日期`:'还没有记录，添加第一个重要日期吧。'}
window.addEventListener('message',event=>{if(event.source!==parent)return;const message=event.data;if(message?.jsonrpc!=='2.0')return;if(pending.has(message.id)){const wait=pending.get(message.id);pending.delete(message.id);clearTimeout(wait.timer);message.error?wait.reject(new Error(message.error.message)):wait.resolve(message.result)}else if(message.method==='ui/notifications/tool-result'){try{show(message.params)}catch(error){status.textContent=error.message}}});
document.getElementById('form').onsubmit=async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;try{show(await request('tools/call',{name:'save_date',arguments:{id:crypto.randomUUID(),name:document.getElementById('name').value,date:document.getElementById('date').value}}));event.target.reset()}catch(error){status.textContent=error.message}finally{button.disabled=false}};
request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Calendar',version:'0.1.0'},appCapabilities:{}}).then(()=>parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*')).catch(error=>{status.textContent=error.message});
</script></body></html>

name: Publish Firefly release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: firefly-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.97.1'
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert json.load(open('package.json'))['version'] == version, 'npm and Cargo versions differ'
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'tag must match package version'
          PY
      - run: npm ci
      - run: npm run check
      - run: npm run test:module-sdk
      - run: cargo clippy --workspace --locked --all-targets -- -D clippy::correctness
      - run: cargo test --workspace --locked -- --test-threads=4
      - run: cargo build --locked
      - name: Python workspace regression
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s src -p '*workspace_test.py'
      - name: Python file service regression
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s src/api -p '*_test.py'
      - run: npm run build:example:module-sdk
      - run: python3 scripts/generate_third_party_licenses.py --check

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Set up Linux musl
        if: runner.os == 'Linux'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake pkg-config
          echo "CARGO_TARGET_$(printf '%s' "$BUILD_TARGET" | tr 'a-z-' 'A-Z_')_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_$(printf '%s' "$BUILD_TARGET" | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - name: Build binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
          CARGO_PROFILE_RELEASE_LTO: 'true'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
        run: cargo build --release --locked --target "$BUILD_TARGET"
      - name: Package binary, configuration and licenses
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p package artifacts
          cp "target/$BUILD_TARGET/release/firefly" package/firefly
          cp .env.example README.md CONTRIBUTING.md SECURITY.md LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md package/
          cp -R docs examples package/
          tar -czf "artifacts/firefly-$BUILD_PLATFORM.tar.gz" -C package .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefly-${{ matrix.platform }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firefly-*
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum ./*.tar.gz | sed 's|  ./|  |' > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --verify-tag --generate-notes --title "$RELEASE_TAG"

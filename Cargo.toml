[package]
name = "firefly"
version = "0.1.2"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/42tr/firefly"
description = "A self-hosted AI workspace with configurable agents and optional modules"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
firefly-codex-transport = { path = "crates/codex-transport" }
reqwest = { version = "0.13.4", features = [
    "json",
    "rustls",
    "stream",
], default-features = false }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = { version = "0.33", default-features = false }
regex = "1.10"
base64 = "0.22"
# time
chrono = { version = "0.4", features = ["serde", "std"] }
chrono-tz = "0.10.0"
# html
scraper = "0.27"
lopdf = "0.45"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
tokio-cron-scheduler = "0.13.0"
croner = "=2.1.0"
dotenvy = "0.15"
envy = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8.3", features = ["multipart", "ws"] }
tower-http = { version = "0.6.1", features = ["cors", "fs", "compression-br", "compression-gzip"] }
tower-cookies = "0.11"

rust-embed = "8.0.0" # 用于打包静态文件
mime_guess = "2.0"   # 猜测文件 MIME 类型
toml = "0.9"         # 解析 ~/.codex/config.toml 的 model_providers

time = "0.3"
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
thiserror = "1"
http = "1.3.1"

# utils
schemars = "0.8"
backon = "1"
# SQLx and the backup command share bundled SQLite 3.51.3.
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"] }
rusqlite = { version = "0.39", default-features = false, features = ["backup"] }
libc = "0.2"        # killpg for agent subprocess groups
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate", "macros", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
futures-util = "0.3"
eventsource-stream = "0.2.3"
tokio-stream = "0.1"
bytes = "1"
sha2 = "0.10"
hmac = "0.12"        # 登录会话与 JWT 签名
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
] }
serde-inline-default = "1.0.1"
# Published Glow runtime; retain the g alias for existing imports.
g = { package = "glow-agent", version = "=0.1.0" }
rmcp = { version = "3.3", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
tempfile = "3"
zip = { version = "=2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
mimalloc = "0.1.52"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

# 保持本地 release 构建速度；GitHub Actions 发布构建通过
# CARGO_PROFILE_RELEASE_LTO/CODEGEN_UNITS 环境变量启用 fat LTO 和单 codegen unit。
[profile.release]
strip = true
lto = "thin"
codegen-units = 16

[workspace]
resolver = "2"
members = ["crates/module-sdk", "crates/codex-transport", "examples/modules/rust-sdk-counter"]

[workspace.package]
license = "MIT"
repository = "https://github.com/42tr/firefly"
rust-version = "1.94"

[workspace.dependencies]
reqwest = { version = "0.13.4", features = [
    "json",
    "rustls",
    "stream",
], default-features = false }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "std"] }
chrono-tz = "0.10.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8.3", features = ["multipart", "ws"] }
thiserror = "1"
rusqlite = { version = "0.39", default-features = false, features = ["backup"] }
libc = "0.2"        # killpg for agent subprocess groups
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate", "macros", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
